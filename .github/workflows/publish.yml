name: 트렌드 생성 및 Pages 발행

on:
  schedule:
    # 매일 한국 시간 09:23. 주간·월간 발행 여부는 한국 시간으로 판정합니다.
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trend-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 구문과 동작 검증
        run: npm run check && npm test
      - name: 새 보고서 생성
        run: npm run collect
      - name: 사이트 빌드
        run: npm run build
      - name: Pages 설정
        uses: actions/configure-pages@v5
      - name: 배포 파일 준비
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
      - name: 게시물과 발행 장부 보관
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/publication.json
          if ! git diff --cached --quiet; then
            git commit -m "Update trend reports and publication ledger"
            git push origin HEAD:main
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
